<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ei Teacher Resource Portal</title>
    <style>
        :root {
            --primary: #2c3e50; 
            --secondary: #3498db; 
            --accent: #e67e22; 
            --success: #27ae60; /* Green */
            --danger: #c0392b; /* Red (Highest Distractor & Incorrect User Selection) */
            --neutral-wrong: #f39c12; /* Orange (Other Distractors) */
            --header-bg: #8F2B28; /* RGB(143, 43, 40) */
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333;
            --border-color: #ccc; /* Grey border */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        /* Header */
        header {
            background-color: var(--header-bg);
            color: white;
            padding: 1.5rem 2rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        header h1 { margin: 0; font-size: 1.8rem; }
        header p { margin: 5px 0 0; font-size: 0.9rem; opacity: 0.8; }

        /* Controls */
        .controls {
            background: white;
            padding: 1rem 2rem;
            display: flex;
            gap: 1rem;
            border-bottom: 1px solid #ddd;
            flex-wrap: wrap;
            align-items: center;
        }
        .controls label { font-weight: 600; color: var(--primary); }

        select, input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        
        /* Search Bar Style */
        #searchInput {
            flex-grow: 1; 
            min-width: 200px;
        }

        /* Grid Layout */
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr; /* Default for top-level flow */
            gap: 0; 
        }
        
        /* Containers that hold individual cards */
        .card-row-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); /* Default to flexible width */
            gap: 25px;
            margin-bottom: 25px;
        }

        /* --- Group Container Styles --- */
        .group-card {
            grid-column: 1 / -1; 
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border-top: 5px solid var(--header-bg);
        }
        
        .passage-area {
            padding: 20px;
            border-bottom: 2px solid #eee;
        }
        
        .passage-content-box {
            padding: 15px;
            border: 1px dashed var(--accent);
            background-color: #fffaf0;
            margin-top: 10px;
            font-size: 1rem;
            line-height: 1.6;
            min-height: 100px;
        }

        .passage-content-box p {
            margin: 0;
            padding: 0;
            font-style: italic;
        }
        
        /* Questions grid inside a group card (enforcing 2 columns) */
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 25px;
            padding: 20px;
        }

        /* --- Card (Individual Question) --- */
        .card {
            background: #fdfdfd;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color); 
            min-height: 250px; /* Helps keep height consistent */
            box-sizing: border-box;
        }
        
        /* Image Optimization */
        .card-full-width {
             grid-column: 1 / -1; /* Spans two columns inside the questions-grid */
        }

        /* Options List */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 1rem;
        }

        /* Image Options Layout (forced horizontal or 2x2) */
        .options-list.image-layout {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 15px;
        }
        
        .options-list.image-layout.grid-2x2 {
            grid-template-columns: repeat(2, 1fr);
        }

        .option-container {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.1s, border-color 0.1s;
        }
        
        .option-container.selected {
            border-color: var(--secondary);
            background-color: #e6f0fa;
        }

        .option-label { display: block; cursor: pointer; }
        .option-label .option-text { display: inline-block; }
        .option-label img { max-width: 100%; height: auto; display: block; margin-top: 5px; }

        /* --- Revealed States --- */
        .options-list.revealed .option-text.correct { color: var(--success); font-weight: 700; }
        .options-list.revealed .option-text.highest-distractor { color: var(--danger); font-weight: 700; }
        .options-list.revealed .option-text.wrong { color: var(--neutral-wrong); }
        
        .stats-panel p { margin: 0; line-height: 1.5; font-weight: normal; font-style: normal; }
        .user-selection .user-choice { font-weight: bold; }
        .user-selection .correct-ans-display { font-weight: bold; }
        .user-selection .user-choice.correct { color: var(--success); }
        .user-selection .user-choice.incorrect { color: var(--danger); }
        .user-selection .correct-ans-display { color: var(--success); }

        /* Interactive Footer */
        .card-footer {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid #eee;
            display: flex;
            flex-direction: column;
        }

        .btn-reveal {
            background-color: var(--header-bg); 
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background-color 0.3s;
        }

        .btn-reveal:hover { background-color: #7a2523; }

        .btn-skip {
            background: none;
            color: #777;
            border: none;
            font-size: 0.8rem;
            margin-top: 5px;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Utility classes */
        .meta-tags { display: flex; justify-content: space-between; font-size: 0.8rem; color: #777; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .group-context { background-color: #eef2f7; padding: 12px; border-radius: 4px; border-left: 4px solid var(--accent); margin-bottom: 10px; font-size: 0.95rem; }
        .question-stem { font-weight: 600; margin-bottom: 1rem; line-height: 1.5; }
        .question-stem img { max-width: 100%; height: auto; border-radius: 4px; margin-top: 10px;}
        .html-content p { margin: 0; }
        .html-content p + p { margin-top: 0.5em; }
    </style>
</head>
<body>

<header>

</div>

<div class="container" id="questionsContainer">

    // --- UTILITY & INTERACTION LOGIC ---

    function hasImageOptions(item) {
        const options = [item.optiona, item.optionb, item.optionc, item.optiond];
        return options.some(opt => opt && opt.includes('<img'));
    }

    function cleanAndRenderHtml(html) {
        if (!html) return '';
        return html;
    }
    
    // --- SELECTION HANDLER ---
    function handleOptionSelect(qcode, selectedOption) {
        document.querySelectorAll(`#q-${qcode} .option-container`).forEach(container => {
            container.classList.remove('selected');
        });
        document.querySelector(`#q-${qcode} .option-container[data-option='${selectedOption}']`).classList.add('selected');
    }

    // --- RENDER LOGIC ---
    function renderPortal(data) {
        const questionsContainer = document.getElementById('questionsContainer');
        questionsContainer.innerHTML = '';
        document.getElementById('questionCount').textContent = `Displaying ${data.length} Questions`;

        // 1. Group data by passage file (and group text as fallback/supplement)
        const groups = {};
        data.forEach(item => {
            const key = (item.passage_file || '') + '|' + (item.group_text || '');
            if (!groups[key]) {
                groups[key] = {
                    passage_file: item.passage_file,
                    group_text: item.group_text,
                    questions: []
                };
            }
            groups[key].questions.push(item);
        });

        let questionCounter = 0;
        
        // 2. Iterate through groups and render
        Object.keys(groups).forEach((key, index) => {
            const group = groups[key];
            const isPassageGroup = (group.passage_file && group.passage_file.trim() !== '') || (group.group_text && group.group_text.trim() !== '');

            // CASE A: Standalone Questions
            if (!isPassageGroup) {
                // Enforce 2-column grid layout for standalones
                questionsContainer.style.gridTemplateColumns = 'repeat(2, 1fr)';
                questionsContainer.style.gap = '25px'; // Ensure gap for standalone questions
                group.questions.forEach(item => {
                    questionsContainer.innerHTML += renderIndividualCard(item);
                    questionCounter++;
                });
                return;
            }

            // CASE B: Grouped Questions
            // Ensure container switches to single-column layout so the group card spans full width
            questionsContainer.style.gridTemplateColumns = '1fr'; 
            questionsContainer.style.gap = '0'; // Clear gap between non-group elements
            
            // Conditional placeholder for passage file content (only if passage_file exists)
            let passagePlaceholder = '';
            if (group.passage_file && group.passage_file.trim() !== '') {
                passagePlaceholder = `
                    <div class="passage-content-box">
                        <p style="font-weight: bold; color: var(--danger);">
                            ⚠️ PASSOUT REQUIRED
                        </p>
                        <p>
                            **Image/File Error:** The browser cannot automatically load the passage file 
                            <code style="background: #fcf8e3; padding: 1px 4px;">${group.passage_file}</code> directly from your file system due to security settings.
                        </p>
                        <p style="margin-top: 10px; font-weight: bold;">
                            **Action:** Please open the file manually and paste its content here, or use a local web server (e.g., Python's <code style="background: #fcf8e3; padding: 1px 4px;">python -m http.server</code>).
                        </p>
                    </div>
                `;
            }

            let groupHtml = `
                <div class="group-card">
                    <div class="passage-area">
                        <h2>Context: ${cleanAndRenderHtml(group.group_text).replace(/\^/g, '')}</h2>
                        ${passagePlaceholder}
                    </div>
                    <div class="questions-grid">
                        ${group.questions.map(item => {
                            questionCounter++;
                            return renderIndividualCard(item);
                        }).join('')}
                    </div>
                </div>
            `;
            questionsContainer.innerHTML += groupHtml;
        });
        
        // 3. Post-render adjustment for specific questions known to need grid
        data.forEach(item => {
            if (hasImageOptions(item)) {
                const optionsListEl = document.getElementById(`options-list-${item.Qcode}`);
                if (optionsListEl) {
                    optionsListEl.classList.add('image-layout');
                    
                    // Specific QCode checks for 2x2 grid (if required by image size)
                    if (item.Qcode === '6527' || item.Qcode === '6533' || item.Qcode === '6541' || item.Qcode === '6544' || item.Qcode === '6559') {
                         optionsListEl.classList.add('grid-2x2');
                    }
                }
            }
        });
    }

    // Helper: Render a single question card
    function renderIndividualCard(item) {
        const qcode = item.Qcode;
        const isImageQuestion = hasImageOptions(item);

        // If it's an image question, it must span the full two columns of its parent grid
        const cardClass = isImageQuestion ? 'card card-full-width' : 'card';
        
        const optionKeys = ['A', 'B', 'C', 'D'];
        const optionText = {
            'A': item.optiona,
            'B': item.optionb,
            'C': item.optionc,
            'D': item.optiond
        };

        let optionsListClass = 'options-list';
        if (isImageQuestion) {
            optionsListClass += ' image-layout';
        }
        
        return `
            <div class="${cardClass}" id="q-${qcode}">
                <div class="meta-tags">
                    <span>${item.Subject} &bull; Class ${item.Class}</span>
                    <span>#${qcode}</span>
                </div>

                <div class="question-stem html-content">${cleanAndRenderHtml(item.question_stem)}</div>

                <div class="${optionsListClass}" data-qcode="${qcode}" id="options-list-${qcode}">
                    ${optionKeys.map(key => `
                        <div class="option-container" 
                             data-option="${key}" 
                             onclick="handleOptionSelect('${qcode}', '${key}')">
                            <label class="option-label">
                                <span class="option-prefix" id="q-${qcode}-prefix-${key}">${key})</span>
                                <span class="option-text html-content" id="q-${qcode}-opt-${key}">${cleanAndRenderHtml(optionText[key])}</span>
                            </label>
                        </div>
                    `).join('')}
                </div>

                <div id="stats-panel-${qcode}"></div>

                <div class="card-footer">
                    <button class="btn-reveal" onclick="revealAnswer('${qcode}', false)">Select the correct option to reveal data</button>
                    <button class="btn-skip" onclick="revealAnswer('${qcode}', true)">Skip and Reveal</button>
                </div>
            </div>
        `;
    }

    // Logic to reveal answer, calculate colors, and show stats
    function colorOptionsAndDisplayStats(item, userSelection) {
        const qcode = item.Qcode;
        const correctAns = item.correct_answer;
        const percentages = {
            'A': item.percent_a,
            'B': item.percent_b,
            'C': item.percent_c,
            'D': item.percent_d
        };
        
        let highestDistractor = null;
        let maxWrongPct = -1;
        
        const distractors = ['A', 'B', 'C', 'D'].filter(key => key !== correctAns);
        distractors.forEach(key => {
            const pct = percentages[key];
            if (pct > maxWrongPct) {
                maxWrongPct = pct;
                highestDistractor = key;
            }
        });
        
        const optionsListEl = document.querySelector(`#q-${qcode} .options-list`);
        optionsListEl.classList.add('revealed');

        for (const key of ['A', 'B', 'C', 'D']) {
            const optionEl = document.getElementById(`q-${qcode}-opt-${key}`);
            const prefixEl = document.getElementById(`q-${qcode}-prefix-${key}`);
            
            optionEl.classList.remove('correct', 'highest-distractor', 'wrong');
            
            const originalText = item[`option${key.toLowerCase()}`];
            const percentText = ` (${percentages[key].toFixed(1)}% students)`;
            optionEl.innerHTML = cleanAndRenderHtml(originalText) + percentText;

            optionEl.closest('.option-container').classList.remove('selected');

            if (key === correctAns) {
                optionEl.classList.add('correct');
                prefixEl.style.color = 'var(--success)';
            } else if (key === highestDistractor) {
                optionEl.classList.add('highest-distractor');
                prefixEl.style.color = 'var(--danger)';
            } else {
                optionEl.classList.add('wrong');
                prefixEl.style.color = 'var(--neutral-wrong)';
            }
        }

        const statsPanelEl = document.getElementById(`stats-panel-${qcode}`);
        
        let userChoiceClass = '';
        if (userSelection) {
            userChoiceClass = userSelection === correctAns ? 'correct' : 'incorrect';
        }
        
        statsPanelEl.innerHTML = `
            <div class="stats-panel">
                <p class="user-selection">
                    Your Selection: <span class="user-choice ${userChoiceClass}">${userSelection ? userSelection : 'Skipped'}</span> 
                    | Correct Answer: <span class="correct-ans-display">${correctAns}</span>
                </p>
            </div>
        `;
    }

    // Interaction Handlers
    function revealAnswer(qcode, isSkip) {
        const cardEl = document.getElementById(`q-${qcode}`);
        const selectedEl = cardEl.querySelector('.option-container.selected');
        const item = questionsData.find(q => q.Qcode === qcode);

        let userSelection = null;
        if (selectedEl) {
            userSelection = selectedEl.dataset.option;
        }

        if (!userSelection && !isSkip) {
            alert("Please select an option before revealing the data.");
            return;
        }
        
        cardEl.querySelectorAll('.btn-reveal, .btn-skip').forEach(btn => btn.disabled = true);
        
        // Show result
        colorOptionsAndDisplayStats(item, userSelection);
    }

    // Filter Logic
    function filterQuestions() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const subj = document.getElementById('subjectFilter').value;
        const cls = document.getElementById('classFilter').value;

        const filtered = questionsData.filter(item => {
            // Subject and Class match
            const matchSubj = (subj === 'all') || (item.Subject === subj);
            const matchClass = (cls === 'all') || (item.Class === cls);
            
            // Keyword match
            let matchKeyword = true;
            if (searchTerm) {
                // Combine relevant fields into a searchable string
                const textToSearch = [
                    item.question_stem, 
                    item.group_text, 
                    item.Subject,
                    item.optiona, 
                    item.optionb, 
                    item.optionc, 
                    item.optiond
                ].join(' ').toLowerCase();
                
                matchKeyword = textToSearch.includes(searchTerm);
            }

            return matchSubj && matchClass && matchKeyword;
        });

        renderPortal(filtered);
    }

    // Init
    function initializePortal() {
        renderPortal(questionsData);
    }

    initializePortal();

</script>
</body>
</html>
